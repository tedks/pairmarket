id: pm-web-replace-localstorage-content
title: Replace the localStorage market-content store
desc: 'apps/web/src/sui/metadata.ts stores market title, prompt and

  operationalization in window.localStorage and the chain gets only a terms

  hash plus a metadata_ref of the form local-browser:<sha>. Consequences today:

  a market created in one browser renders "Encrypted metadata is not available

  in this browser" everywhere else, so no invitee can read the market they are

  betting on.


  Ted: "this obviously seems completely wrong" (2026-09-10).


  Replace with client-side SEAL encryption plus whichever store

  pm-privacy-content-storage-decision selects. The change is well isolated:

  metadata.ts is about 94 lines and nothing else in the app depends on Walrus or

  SEAL, so this is the only load-bearing consumer.


  While here, remove the type comment in apps/web/src/types.ts that says the

  policy boundary is modelled by gating reveal in the UI rather than encrypting,

  once that is no longer true.'
