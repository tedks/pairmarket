id: pm-move-drop-subject-consent
title: Remove the subject consent gate from Move and web
desc: 'Per pm-pivot-2026-09-10, there is no per-market subject consent: platform

  membership is consent. Remove the machinery that implements the superseded

  gate.


  Move (contracts/pairmarket/sources/market.move): record_subject_consent entry

  point, the SubjectConsented event, the ConsentPending lifecycle state and its

  guards, and the two-subject attestation rounds including mismatch reset.

  Removing the consent gate also removes a liveness hazard: today a market

  cannot open until two specific people each sign, and nothing can compel them.


  Web (apps/web): the consent button and its selectors in MarketDetail, and the

  attestation UI insofar as it targets subjects rather than friends.


  Keep: the isMarketVisible filter that hides a market from its own subjects.

  That behaviour is correct and intentional.


  Sequencing: do this with or after pm-resolution-friend-attestation so the

  replacement lands in the same shape, rather than leaving the contract with no

  resolution path at all.'
type: task
