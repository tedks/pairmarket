id: pm-move-challenge-bond-escrow
title: Implement challenge bond escrow and slashing
desc: The merged Move MVP exposes open_challenge but does not yet collect, escrow,
  and route challenge bonds. Implement bond coin handling, losing-challenge slashing,
  successful-challenge refund/reward rules, and unit tests for both paths.
