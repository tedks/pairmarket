  comment: 'Likely moot after the 2026-09-10 pivot (pm-pivot-2026-09-10): there is
    no per-market subject consent, since platform membership is consent, and subjects
    have no view of markets about themselves. Left open rather than closed in case
    the P2 visibility question survives independently of consent. Ted to confirm.'
