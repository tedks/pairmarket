id: pm-privacy-walrus-renewal-policy
title: Walrus blob renewal policy by class
desc: 'Decide which blob classes get perpetual renewal vs TTL on Walrus. Tradeoffs:
  P4 evidence likely wants perpetual, P1 chat may TTL after N days, P3 drafts can
  be local-only. Specify who pays (package vs user) and how renewal is triggered (cron,
  on-read, on-market-close).'
