id: pm-resolution-dispute-committee
title: Bootstrap, rotation, and conflict rules for dispute multisig
desc: 'MVP routes disputed markets to a 3-of-5 community multisig. Specify: who the
  initial signers are, how the set is rotated, what counts as a conflict of interest
  (signer is a participant or in the social graph), quorum tuning, the 14-day verdict
  deadline, and the governance object that holds the key set.'
