- time: 2026-09-26T19:50:34-00:00
  who: Ted Smith
  what: commented
  comment: 'Reshaped by the 2026-09-10 pivot (pm-pivot-2026-09-10): the friend set
    resolves, so bootstrap and rotation of a standing 3-of-5 multisig may not be the
    right frame at all. Two live defects are split out to pm-move-committee-threshold:
    the web appends the creator to the resolver committee, and Move accepts the first
    verdict from any single member with no threshold, so a creator can decide disputes
    on their own market.'
