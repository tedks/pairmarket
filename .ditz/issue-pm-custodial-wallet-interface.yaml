  comment: 'Retirement shard off-duty/waiting/2026-09-26-da633dc2-pairmarket-devstack-purge-sui173.md
    flags this as the blocking open decision after Ted''s 2026-09-10 product pivot
    to friends-resolution: sign-in provider. ''No server'' and ''sign in with Twitter,
    you have a wallet'' cannot both hold, because custody needs a server by definition
    and zkLogin (the serverless path) does not support X/Twitter (X does not issue
    the OIDC id_token zkLogin needs; Google, Facebook, Twitch, Apple do, Slack/Kakao/Microsoft
    partial). Options: switch to Google or Apple and get zkLogin with no server of
    Ted''s; keep Twitter and keep a small server; or ship self-custody only, which
    already works in the app today (pm-web-self-custody-wallet). Recommendation from
    the source session: self-custody now for a friends beta, zkLogin-with-Google later.
    This gates roughly 18% of the MVP roadmap (the custody phase). Decides: Ted.'
