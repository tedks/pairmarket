id: pm-custodial-wallet-interface
title: Design Twitter-backed custodial wallet service
desc: Define the Twitter OAuth to user identity mapping, custodial key generation
  and storage, signing authorization, rate limits, abuse controls, recovery, audit
  logging, and migration path to self-custody or zkLogin-equivalent ownership without
  breaking existing markets.
