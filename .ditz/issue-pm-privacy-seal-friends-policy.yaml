id: pm-privacy-seal-friends-policy
title: Implement seal_approve predicates for friends of the subjects
desc: "Per pm-pivot-2026-09-10, SEAL is retained and the policy is friends of the\nsubjects.
  Nothing exists today: grep for seal_approve across the repo returns\nzero hits,
  and both @mysten/seal and @mysten/walrus are declared in\npackages/core/package.json
  and never imported.\n\nWork:\n\n- seal_approve_* entry points in the Move package
  whose predicate is: the\n  caller holds an accepted Friendship with subject A or
  subject B. The\n  Friendship objects are already on-chain, so the caller can prove\n
  \ friendship by presenting one, which keeps the check O(1).\n- Decide whether friends-of-friends
  is in scope for the policy. The\n  visibility enum already has that scope, but as
  a SEAL predicate it is a\n  two-hop graph query and needs the caller to present
  a path of two\n  Friendship objects.\n- Policy epoch rotation, so that unfriending
  removes access to future\n  content. Zero hits for epoch in market.move today; PolicyEpoch
  exists in\n  packages/core as a brand and parser with no caller. Note SEAL cannot\n
  \ retract what someone already decrypted, which the design doc already\n  accepts
  as leakage.\n- Derive the policy identity properly. The web currently writes the
  literal\n  string localnet-self-custody-v1 into the seal_policy_id field.\n\nRelated:
  pm-privacy-policy-model (scope changed by the pivot),\npm-privacy-key-server-set
  (which operators form the threshold committee)."
