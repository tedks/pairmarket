id: pm-wallet-zklogin-migration
title: Define migration from custody to user-held keys
desc: Specify the protocol for moving an account from custodial KeyRef to user-held
  zkLogin or equivalent keys without breaking market membership, SEAL policy access,
  positions, or pending payouts.
