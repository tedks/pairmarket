- time: 2026-09-26T19:50:35-00:00
  who: Ted Smith
  what: commented
  comment: 'Constraint found 2026-09-10 and verified against the Sui docs: X/Twitter
    is not a zkLogin provider. zkLogin supports Google, Facebook, Twitch and Apple
    fully, with Slack, Kakao and Microsoft partial, because X does not issue the OIDC
    id_token zkLogin requires. So the migration off custody cannot keep Twitter as
    the identity provider: either the provider changes for migrated users, or the
    migration path is something other than zkLogin. zkLogin also needs a salt service
    and a proving service, though hosted ones exist. See pm-pivot-2026-09-10.'
