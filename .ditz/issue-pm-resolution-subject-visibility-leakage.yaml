id: pm-resolution-subject-visibility-leakage
title: Can subjects see inviter list during Trading
desc: 'Define exactly what subjects see while a market is Trading: counts only, or
  counts plus identities of inviters/participants. Specify the SEAL policy on the
  participant roster blob and the on-chain commitment scheme that hides participant
  addresses until settlement.'
type: task
component: resolution
release:
reporter: Ted Smith <tedks@riseup.net>
status: closed
disposition: fixed
creation_time: 2026-06-27T05:18:25-00:00
references: []
log_events:
- time: 2026-06-27T05:18:25-00:00
  who: Ted Smith
  what: created
  comment: ""
- time: 2026-09-26T19:50:08-00:00
  who: Ted Smith
  what: 'closed: fixed'
  comment: 'Decided by Ted 2026-09-10: subjects see nothing about markets concerning
    themselves, and there is no per-market subject consent, because platform membership
    is consent. The isMarketVisible filter in apps/web/src/sui/state.ts that returns
    false for subjects is therefore correct behaviour, not the bug an audit called
    it. No participant-roster SEAL policy or address-hiding commitment scheme is needed
    for subjects, since subjects have no view at all. Record in pm-pivot-2026-09-10.'
