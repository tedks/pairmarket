  comment: 'Done 2026-09-06 via sui-devstack PR #3 (merge 26d921f): Sui pin moved
    to mainnet-v1.73.2 and every Dockerfile base moved bullseye->bookworm (bullseye
    LTS ended 2026-08-31 and its security pool now 404s, so no image could be built
    at all). All six sui-devstack/*:1.73.2-r1 images built on tower0 2026-09-06. Verified
    by a real cycle in ~/Projects/pairmarket/master on tower0: devstack:up -> deploy
    -> reset -> up -> deploy -> purge, with two successful package publishes against
    the 1.73.2 runtime (0x59db77d0..., 0x802bab56...). Caveat: the images exist on
    tower0 only; any other host must run ./build.sh (about 1h45m for the full set,
    30 min for sui-localnet alone).'
