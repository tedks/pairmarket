id: pm-docs-design-superseded-sections
title: Annotate or rewrite design.md sections superseded by the pivot
desc: "docs/design.md still describes the design superseded by\npm-pivot-2026-09-10.
  A stranger reading it today would implement the wrong\nsystem. Annotate or rewrite
  at minimum:\n\n- Resolution mechanism: subject co-attestation with a 72-hour challenge\n
  \ window and a 3-of-5 committee is superseded by bonded attestation of the\n  subjects'
  friends.\n- Consent: the requirement that both subjects consent before trading is\n
  \ removed.\n- Privacy model: the Walrus envelope may not exist at all; SEAL policy
  is\n  friends of the subjects; ciphertext location is open.\n- Custodial wallet
  design: still valid as of the 2026-09-26 server decision,\n  but note that the zkLogin
  migration path cannot use Twitter as the OIDC\n  provider.\n- Phasing: Phase 3 and
  Phase 5 both change shape.\n\nAlso stale and cheap to fix while here: README.md
  still says \"Pre-spec\"\nalthough the spec landed, and the repo is public with no
  LICENSE file (Move.toml\nnotes the license is intentionally unset pending a repo-level
  decision).\n\nAn ADR under docs/adr/ is the natural home for the pivot itself if
  Ted wants\nthe reasoning in-tree rather than only in ditz."
