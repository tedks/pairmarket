  comment: 'Implemented in PR #22 (merged 2026-09-05 as 63883f4): the compose project
    defaults to pairmarket-devstack in master/main and pairmarket-devstack-<name>-<hash6>
    elsewhere, is recorded in .devstack/compose-project by up (only after upstream
    has started the stack), read back by every other verb, and overridden by SUI_DEVSTACK_COMPOSE_PROJECT
    (validated against compose''s charset).'
