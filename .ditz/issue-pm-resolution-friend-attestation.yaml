id: pm-resolution-friend-attestation
title: Resolve markets by bonded attestation of the subjects' friends
desc: "Replaces subject co-attestation (design.md Resolution mechanism) per the\n2026-09-10
  pivot: see pm-pivot-2026-09-10. Markets resolve by asking the\nfriends of the subjects
  whether the operationalization held.\n\nThe problem to solve, not to wish away:
  the eligible attestor set and the\nparticipant set are nearly the same people in
  a friend group, and pari-mutuel\npayouts reward attesting your own position. Without
  a cost, resolution is a\nvote by interested parties and the outcome is whichever
  side has more voters.\n\nDesign direction recommended by the session that recorded
  the pivot:\n\n- One bonded ladder, not separate attestation and challenge primitives.\n
  \ Asserting an outcome, challenging one, and escalating are the same move at\n  rising
  prices.\n- Attestation itself is bonded. Attestors who end up against the final\n
  \ outcome are slashed. That converts the vote into a Schelling game whose\n  cheapest
  strategy is the fact the friend group can already see, which is\n  the product premise
  in .planning/BRIEF.md.\n- Eligibility to attest derives from an accepted Friendship
  with a subject,\n  which is already on-chain and requires the counterparty to accept.
  See\n  pm-profile-sybil-gating for why that matters.\n\nOpen sub-decisions for Ted:
  is attestation bonded (recommended yes); where a\nslashed bond goes (winning pool
  recommended, versus fee recipient or burn);\nquorum and timing for the friend set;
  what happens when the friend set is too\nsmall or does not respond.\n\nMove surface
  this invalidates: record_subject_consent, SubjectConsented, the\ntwo-subject attestation
  rounds with mismatch reset, and the round-reset logic\nin contracts/pairmarket/sources/market.move.
  See pm-move-drop-subject-consent."
