id: pm-privacy-content-storage-decision
title: Decide where SEAL-encrypted market content lives
desc: "Ted's decision. The localStorage content store must go (pm-pivot-2026-09-10\nitem
  4), and as of 2026-09-26 a server is accepted, which reopens where the\nSEAL-encrypted
  market content should live.\n\nOptions and their costs:\n\n- On-chain, in the Move
  object. SEAL is storage-agnostic and supports this.\n  Cheap for the content sizes
  involved (title, prompt, operationalization are\n  hundreds of bytes to a few KB).
  Removes the Walrus blob-renewal problem.\n  Cost: permanence. On-chain ciphertext
  never expires and cannot be deleted,\n  so a future key-server threshold compromise
  retroactively opens every market\n  ever created. For relationship gossip that is
  a real product risk. Also\n  sharpens pm-market-visibility-durable-storage (Sui
  field limits).\n- On the server, now that one exists. Deletable and cheap, but the
  server\n  becomes a availability dependency for reading markets, and the trust story\n
  \ gets worse unless the bytes stay SEAL-encrypted end to end.\n- Walrus after all.
  Blobs lapse, which is a feature for this content class,\n  at the cost of the renewal
  policy work in pm-privacy-walrus-renewal-policy.\n\nWhichever is chosen, the ciphertext
  should be produced client-side under a\nSEAL policy; see pm-privacy-seal-friends-policy."
