id: pm-resolution-mechanism
title: Decide MVP relationship-market resolution mechanism
desc: 'Choose and defend how private relationship markets resolve: eligible attestors,
  subject self-report, challenge windows, evidence handling, griefing resistance,
  appeal/finality, and what Move can enforce versus what remains off-chain. The design
  doc should make one MVP recommendation and list deferred alternatives.'
